name: keeper-events
env:
  SERVICE: keeper-events
  LAYER: micro
  COMPOSE_FILE: keeper-micro-compose.yml
  KEEPER_ROOT: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories
  LAYER_DIR: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories/micro
  DEST: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories/micro/keeper-events
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Gradle build
        run: gradle clean build -x test

      - name: Publish into repositories
        run: |
          mkdir -p "${{ env.DEST }}"
          rsync -a --exclude '.git' ./ "${{ env.DEST }}/"

      - name: Compose up ${{ env.SERVICE }}
        run: |
          docker compose --project-directory "${{ env.LAYER_DIR }}" \
            --env-file "${{ env.KEEPER_ROOT }}/.env" \
            -f "${{ env.LAYER_DIR }}/${{ env.COMPOSE_FILE }}" \
            up -d --build --no-deps --force-recreate "${{ env.SERVICE }}"
